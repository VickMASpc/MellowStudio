name: Mellow Studio CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  sprint_docs:
    name: Sprint documentation gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test documentation policy
        run: python scripts/check_sprint_docs.py --self-test
      - name: Ensure roadmap and log updated with code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_sprint_docs.py --base "$BASE_SHA" --head "$HEAD_SHA"
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify merged-branch cleanup never deletes unmerged work
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: node scripts/test_branch_prune.js
      - name: Parse Windows safe-sync script
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/sync_windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }
      - name: Exercise destructive force-sync with an offline Git fixture
        if: runner.os == 'Windows' && matrix.python == '3.11'
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_force_sync_windows.ps1
      - name: Compile all modules
        run: python -m compileall -q mellowstudio
      - name: Run headless engine tests (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest -q --ignore=tests/test_qt_smoke.py
      - name: Run engine and Qt GUI smoke tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -vv -x --timeout=25 --timeout-method=thread
      - name: Validate linked hold sample
        run: python -m mellowstudio.cli validate examples/mellow_hold_blink_v02.mellowzip
