name: Mellow Studio CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile all modules
        run: python -m compileall -q mellowstudio
      - name: Run engine and GUI smoke tests
        run: python -m pytest -q
      - name: Validate linked hold sample
        run: python -m mellowstudio.cli validate examples/mellow_hold_blink_v02.mellowzip
