[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mellowstudio"
version = "0.2.5.dev0"
description = "Pixel-exact, measured-grid sprite animation editor for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "Pillow>=10.3,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-timeout>=2.4,<3"]
build = ["pyinstaller>=6,<8"]
dev = ["pytest>=8,<10", "pytest-timeout>=2.4,<3", "pyinstaller>=6,<8"]

[project.scripts]
mellowstudio = "mellowstudio.main:main"

[tool.setuptools]
packages = ["mellowstudio"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
